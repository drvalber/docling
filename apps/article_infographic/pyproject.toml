[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "article-infographic"
version = "0.1.0"
description = "Turn a scientific or medical article (PDF) into a one-page infographic with charts, schemas and the reference, powered by Docling."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "docling>=2.60.0",
  "docling-core>=2.86.0",
  "pydantic>=2.0",
  "jinja2>=3.1",
  "requests>=2.32",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
pdf = ["playwright>=1.45"]
dev = ["pytest>=8.0"]

[project.scripts]
article-infographic = "article_infographic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/article_infographic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
